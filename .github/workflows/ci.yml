name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      # Postgres only (migrations applied): the schema needs auth.users,
      # storage.buckets and the extensions schema, so plain Postgres won't do.
      - run: supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
        working-directory: server
      - run: go vet ./...
        working-directory: server
      - run: go test ./... -race -cover -coverpkg=./...
        working-directory: server

  # The docker job builds the static export; this one checks the code and runs the tests.
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # pnpm at the version in package.json ("packageManager"); with CI set it keeps the lockfile frozen.
      - run: corepack enable
      - run: make client-install
      - run: make client-lint
      - run: make client-test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t hovr:ci .
