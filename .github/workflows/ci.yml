name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
        working-directory: server
      - run: go vet ./...
        working-directory: server
      # No Postgres here: its image comes from a registry that throttles the
      # runners. Tests needing a database skip themselves; run `make test` locally.
      - run: go test ./... -race
        working-directory: server

  # The docker job builds the static export; this one checks the code and runs the tests.
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # pnpm at the version in package.json ("packageManager"); with CI set it keeps the lockfile frozen.
      - run: corepack enable
      - run: make client-install
      - run: make client-lint
      - run: make client-test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t hovr:ci .
